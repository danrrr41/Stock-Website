<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Pro Gateway</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { 
            font-family: 'Inter', 'Malgun Gothic', sans-serif; 
            background: #ffffff; 
            margin: 0; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
        }
        .pw-box { 
            background: white; 
            padding: 40px; 
            border-radius: 24px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.1); 
            text-align: center; 
            width: 100%; 
            max-width: 360px; 
            border: 1px solid #eee; 
        }
        .pw-box h2 { margin: 0 0 10px; font-weight: 800; font-size: 1.5rem; }
        .pw-box p { color: #86868b; font-size: 0.9rem; margin-bottom: 25px; }
        .pw-box input { 
            width: 100%; 
            padding: 15px; 
            border: 2px solid #f2f2f2; 
            border-radius: 12px; 
            font-size: 1.1rem; 
            font-weight: 700; 
            text-align: center; 
            outline: none; 
            margin-bottom: 15px; 
            box-sizing: border-box; 
        }
        .pw-box input:focus { border-color: #111; }
        .pw-box button { 
            width: 100%; 
            padding: 15px; 
            background: #111; 
            color: white; 
            border: none; 
            border-radius: 12px; 
            font-size: 1rem; 
            font-weight: 700; 
            cursor: pointer; 
            transition: background 0.2s;
        }
        .pw-box button:hover { background: #333; }
        #pw-error { color: #ff3b30; margin-top: 15px; display: none; font-weight: 600; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="pw-box">
        <h2>🔒 Access Restricted</h2>
        <p>비밀번호를 입력하여 접속하세요.</p>
        <input type="password" id="site-pw" placeholder="Password" autofocus onkeydown="if(event.key==='Enter') checkPassword()">
        <button onclick="checkPassword()">접속하기</button>
        <p id="pw-error">비밀번호가 올바르지 않습니다.</p>
    </div>

    <script>
        const SITE_PASSWORD_SECRET = "0603";

        function checkPassword() {
            const pw = document.getElementById('site-pw').value;
            if (pw === SITE_PASSWORD_SECRET) {
                sessionStorage.setItem('site_auth', 'true');
                location.href = '/stock'; // Redirect to main dashboard
            } else {
                document.getElementById('pw-error').style.display = 'block';
                document.getElementById('site-pw').value = '';
                document.getElementById('site-pw').focus();
            }
        }

        // Already authenticated? Skip gateway.
        if (sessionStorage.getItem('site_auth') === 'true') {
            location.href = '/stock';
        }
    </script>
</body>
</html>
