<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>매매 기록 - Record</title>
    <link rel="stylesheet" href="/static/style.css">
    <script>
        if (sessionStorage.getItem('site_auth') !== 'true' || !sessionStorage.getItem('user_id')) {
            location.href = '/';
        }
        const UID = sessionStorage.getItem('user_id') || '';
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        .site-nav { position: relative; display: inline-block; }
        .site-nav-btn { background: none; border: none; font-size: 2rem; font-weight: 700; cursor: pointer; padding: 0; display: flex; align-items: center; gap: 5px; color: #111; font-family: 'Inter','Malgun Gothic',sans-serif; }
        .site-dropdown { display: none; position: absolute; top: 100%; left: 0; background: white; border: 1px solid #e5e5e5; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); z-index: 2000; min-width: 220px; padding: 8px; margin-top: 10px; }
        .site-dropdown a { display: block; padding: 12px 16px; text-decoration: none; color: #444; font-weight: 600; border-radius: 8px; font-size: 0.95rem; }
        .site-dropdown a:hover { background: #f5f5f7; }
        .site-dropdown a.active { color: #111; background: #f0f0f0; }
        .toolbar-btn { padding: 10px 20px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .btn-dark { background: #111; color: #fff; }
        .btn-light { background: #fff; color: #444; border: 1px solid #ddd; }

        .stat-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 20px; }
        .stat-card { background: #fff; border: 1px solid #e5e5e5; border-radius: 14px; padding: 18px 22px; }
        .stat-card .lbl { font-size: 0.72rem; color: #999; text-transform: uppercase; font-weight: 700; }
        .stat-card .val { font-size: 1.7rem; font-weight: 800; margin-top: 6px; }

        .panel { background: #fff; border: 1px solid #e5e5e5; border-radius: 14px; padding: 20px; margin-bottom: 20px; }
        .panel h3 { margin: 0 0 14px; font-weight: 700; font-size: 1.05rem; }
        table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
        th, td { padding: 9px 10px; text-align: center; border-bottom: 1px solid #f0f0f0; }
        th { background: #fafafa; font-weight: 700; color: #555; }
        .tag-buy { color: #ff3b30; font-weight: 700; }
        .tag-sell { color: #007aff; font-weight: 700; }
        .mini-btn { border: none; background: #f2f2f2; border-radius: 6px; padding: 4px 9px; cursor: pointer; font-size: 0.78rem; font-weight: 600; color: #555; }
        .mini-btn:hover { background: #e6e6e6; }

        #modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; align-items: center; justify-content: center; z-index: 5000; }
        .modal-box { background: #fff; border-radius: 16px; padding: 30px; width: 360px; box-shadow: 0 20px 50px rgba(0,0,0,0.2); }
        .modal-box h3 { margin: 0 0 18px; font-weight: 800; }
        .modal-box label { display: block; font-size: 0.78rem; font-weight: 700; color: #666; margin: 12px 0 4px; }
        .modal-box input, .modal-box select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 0.95rem; box-sizing: border-box; }
        .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 22px; }
    </style>
</head>
<body>
    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <div class="site-nav">
                <button class="site-nav-btn" onclick="toggleSiteDropdown()">📒 매매 기록</button>
                <div id="site-dropdown" class="site-dropdown">
                    <a href="/stock">📈 Overview</a>
                    <a href="/mdd">📊 MDD</a>
                    <a href="/record" class="active">📝 Record</a>
                    <a href="/review">🔍 Review</a>
                    <a href="/log">🧾 Log</a>
                </div>
            </div>
            <div style="display: flex; gap: 10px; align-items: center;">
                <button class="toolbar-btn btn-light" onclick="location.href='/record'">← 보유 종목</button>
                <button class="toolbar-btn btn-dark" onclick="openAddModal()">＋ 매매 기록 추가</button>
            </div>
        </div>

        <div class="stat-cards" style="grid-template-columns: repeat(4, 1fr);">
            <div class="stat-card"><div class="lbl">총 손익 (실현+평가)</div><div class="val" id="s-total">·</div></div>
            <div class="stat-card"><div class="lbl">실현손익</div><div class="val" id="s-realized">·</div></div>
            <div class="stat-card"><div class="lbl">평가손익 (보유)</div><div class="val" id="s-unreal">·</div></div>
            <div class="stat-card"><div class="lbl">승률</div><div class="val" id="s-winrate">·</div></div>
        </div>

        <div class="panel">
            <h3>📊 종목별 요약</h3>
            <table>
                <thead><tr><th>종목</th><th>순보유</th><th>평균단가</th><th>실현손익</th><th>거래수</th></tr></thead>
                <tbody id="per-ticker-body"><tr><td colspan="5" style="color:#999;">데이터 없음</td></tr></tbody>
            </table>
        </div>

        <div class="panel">
            <h3>🧾 거래 내역</h3>
            <table>
                <thead><tr><th>날짜</th><th>종목</th><th>구분</th><th>단가</th><th>수량</th><th>수수료</th><th>메모</th><th></th></tr></thead>
                <tbody id="entries-body"><tr><td colspan="8" style="color:#999;">데이터 없음</td></tr></tbody>
            </table>
        </div>
    </div>

    <!-- 추가/수정 모달 -->
    <div id="modal-overlay">
        <div class="modal-box">
            <h3 id="modal-title">매매 기록 추가</h3>
            <input type="hidden" id="f-id">
            <label>종목 (Ticker)</label>
            <input id="f-ticker" placeholder="AAPL" style="text-transform: uppercase;">
            <label>구분</label>
            <select id="f-type"><option value="buy">매수</option><option value="sell">매도</option></select>
            <label>날짜</label>
            <input id="f-date" type="date">
            <label>단가</label>
            <input id="f-price" type="number" step="any" placeholder="190.50">
            <label>수량 (주)</label>
            <input id="f-qty" type="number" step="any" placeholder="10">
            <label>수수료 (선택)</label>
            <input id="f-fee" type="number" step="any" placeholder="0">
            <label>메모 (선택)</label>
            <input id="f-memo">
            <div class="modal-actions">
                <button class="toolbar-btn btn-light" onclick="closeModal()">취소</button>
                <button class="toolbar-btn btn-dark" onclick="submitEntry()">저장</button>
            </div>
        </div>
    </div>

    <div id="error-popup"><div class="error-icon">!</div><div id="error-message"></div></div>
    <div id="toast"></div>

    <script>
        let entriesCache = [];

        function showError(m) { const p = document.getElementById('error-popup'); document.getElementById('error-message').innerText = m; p.style.display = 'flex'; setTimeout(() => p.style.display = 'none', 5000); }
        function showToast(m) { const t = document.getElementById('toast'); t.innerText = m; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 2500); }
        function toggleSiteDropdown() { const d = document.getElementById('site-dropdown'); d.style.display = d.style.display === 'block' ? 'none' : 'block'; }
        window.onclick = (e) => { if (!e.target.closest('.site-nav')) document.getElementById('site-dropdown').style.display = 'none'; };

        function fmtMoney(v) {
            if (v === null || v === undefined || isNaN(v)) return 'N/A';
            const sign = v >= 0 ? '+' : '-';
            return `${sign}$${Math.abs(v).toLocaleString('en-US', { maximumFractionDigits: 2 })}`;
        }

        async function loadLedger() {
            try {
                const res = await fetch(`/api/ledger/list?uid=${UID}`);
                if (!res.ok) throw new Error('원장 로드 실패');
                const data = await res.json();
                entriesCache = data.entries || [];
                renderStats(data.stats);
                renderPerTicker(data.stats);
                renderEntries(entriesCache);
            } catch (e) { showError(e.message); }
        }

        function renderStats(stats) {
            const setMoney = (id, v) => { const el = document.getElementById(id); el.innerText = fmtMoney(v); el.className = 'val ' + (v >= 0 ? 'up' : 'down'); };
            setMoney('s-total', stats.total_pnl);
            setMoney('s-realized', stats.total_realized);
            setMoney('s-unreal', stats.unrealized);
            document.getElementById('s-winrate').innerText = stats.win_rate + '%';
        }

        function renderPerTicker(stats) {
            const body = document.getElementById('per-ticker-body');
            if (!stats.per_ticker || !stats.per_ticker.length) { body.innerHTML = `<tr><td colspan="5" style="color:#999;">데이터 없음</td></tr>`; return; }
            body.innerHTML = stats.per_ticker.map(r => `
                <tr>
                    <td style="font-weight:700;">${r.ticker}</td>
                    <td>${r.net_qty}</td>
                    <td>${r.avg_cost ? '$' + r.avg_cost.toLocaleString('en-US', { maximumFractionDigits: 2 }) : '-'}</td>
                    <td class="${r.realized >= 0 ? 'up' : 'down'}" style="font-weight:700;">${fmtMoney(r.realized)}</td>
                    <td>${r.trades}</td>
                </tr>`).join('');
        }

        function renderEntries(entries) {
            const body = document.getElementById('entries-body');
            if (!entries.length) { body.innerHTML = `<tr><td colspan="8" style="color:#999;">데이터 없음</td></tr>`; return; }
            const sorted = [...entries].sort((a, b) => (b.date || '').localeCompare(a.date || ''));
            body.innerHTML = sorted.map(e => `
                <tr>
                    <td>${e.date}</td>
                    <td style="font-weight:700;">${e.ticker}</td>
                    <td class="${e.type === 'buy' ? 'tag-buy' : 'tag-sell'}">${e.type === 'buy' ? '매수' : '매도'}</td>
                    <td>$${Number(e.price).toLocaleString('en-US', { maximumFractionDigits: 2 })}</td>
                    <td>${e.quantity}</td>
                    <td>${e.fee ? '$' + Number(e.fee).toLocaleString('en-US', { maximumFractionDigits: 2 }) : '-'}</td>
                    <td style="color:#888;">${e.memo || ''}</td>
                    <td>
                        <button class="mini-btn" onclick="openEditModal('${e.id}')">수정</button>
                        <button class="mini-btn" onclick="deleteEntry('${e.id}')">삭제</button>
                    </td>
                </tr>`).join('');
        }

        function openAddModal() {
            document.getElementById('modal-title').innerText = '매매 기록 추가';
            document.getElementById('f-id').value = '';
            document.getElementById('f-ticker').value = '';
            document.getElementById('f-type').value = 'buy';
            document.getElementById('f-date').value = new Date().toISOString().split('T')[0];
            document.getElementById('f-price').value = '';
            document.getElementById('f-qty').value = '';
            document.getElementById('f-fee').value = '';
            document.getElementById('f-memo').value = '';
            document.getElementById('modal-overlay').style.display = 'flex';
        }
        function openEditModal(id) {
            const e = entriesCache.find(x => x.id === id);
            if (!e) return;
            document.getElementById('modal-title').innerText = '매매 기록 수정';
            document.getElementById('f-id').value = e.id;
            document.getElementById('f-ticker').value = e.ticker;
            document.getElementById('f-type').value = e.type;
            document.getElementById('f-date').value = e.date;
            document.getElementById('f-price').value = e.price;
            document.getElementById('f-qty').value = e.quantity;
            document.getElementById('f-fee').value = e.fee || '';
            document.getElementById('f-memo').value = e.memo || '';
            document.getElementById('modal-overlay').style.display = 'flex';
        }
        function closeModal() { document.getElementById('modal-overlay').style.display = 'none'; }

        async function submitEntry() {
            const id = document.getElementById('f-id').value;
            const ticker = document.getElementById('f-ticker').value.trim().toUpperCase();
            const type = document.getElementById('f-type').value;
            const date = document.getElementById('f-date').value;
            const price = parseFloat(document.getElementById('f-price').value);
            const quantity = parseFloat(document.getElementById('f-qty').value);
            const fee = parseFloat(document.getElementById('f-fee').value) || 0;
            const memo = document.getElementById('f-memo').value.trim();
            if (!ticker || !date || isNaN(price) || isNaN(quantity)) { showError('종목/날짜/단가/수량을 모두 입력하세요.'); return; }
            const url = id ? '/api/ledger/update' : '/api/ledger/add';
            const body = id ? { uid: UID, id, ticker, type, date, price, quantity, fee, memo } : { uid: UID, ticker, type, date, price, quantity, fee, memo };
            try {
                const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
                if (!res.ok) {
                    let msg = '저장 실패';
                    try { const er = await res.json(); if (er.detail) msg = er.detail; } catch (_) {}
                    throw new Error(msg);
                }
                closeModal(); showToast(id ? '수정되었습니다.' : '추가되었습니다.'); loadLedger();
            } catch (e) { showError(e.message); }
        }
        async function deleteEntry(id) {
            if (!confirm('이 거래를 삭제할까요?')) return;
            try {
                const res = await fetch('/api/ledger/delete', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ uid: UID, id }) });
                if (!res.ok) throw new Error('삭제 실패');
                showToast('삭제되었습니다.'); loadLedger();
            } catch (e) { showError(e.message); }
        }

        loadLedger();
    </script>
</body>
</html>
