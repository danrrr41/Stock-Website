<div class="indicators">
    <div class="indicator-item" onclick="showIndicatorPopup('rsi', {{index}}, event)">
        <span class="indicator-label">RSI</span>
        <span class="indicator-value {{rsiClass}}">{{rsi}}</span>
    </div>
    <div class="indicator-item" onclick="showIndicatorPopup('mfi', {{index}}, event)">
        <span class="indicator-label">MFI</span>
        <span class="indicator-value {{mfiClass}}">{{mfi}}</span>
    </div>
    <div class="indicator-item" onclick="showIndicatorPopup('adx', {{index}}, event)">
        <span class="indicator-label">ADX</span>
        <span class="indicator-value {{adxClass}}">{{adx}}</span>
    </div>
    <div class="indicator-item" onclick="showIndicatorPopup('di', {{index}}, event)">
        <span class="indicator-label">+DI / -DI</span>
        <span class="indicator-value {{diClass}}">{{di}}</span>
    </div>
    <div class="indicator-item" onclick="showIndicatorPopup('pb', {{index}}, event)">
        <span class="indicator-label">%B</span>
        <span class="indicator-value {{pbClass}}">{{pb}}</span>
    </div>
</div>
