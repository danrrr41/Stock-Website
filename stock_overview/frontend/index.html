<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Overview Pro</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <script>
        // 인증 체크: 세션 인증/사용자ID가 없으면 대문으로 리다이렉트
        if (sessionStorage.getItem('site_auth') !== 'true' || !sessionStorage.getItem('user_id')) {
            location.href = '/';
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        .site-nav { position: relative; display: inline-block; }
        .site-nav-btn { 
            background: none; 
            border: none; 
            font-size: 2rem; 
            font-weight: 700; 
            cursor: pointer; 
            padding: 0; 
            display: flex; 
            align-items: center; 
            gap: 5px; 
            color: #111;
            font-family: 'Inter', 'Malgun Gothic', sans-serif;
        }
        .site-dropdown { display: none; position: absolute; top: 100%; left: 0; background: white; border: 1px solid #e5e5e5; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); z-index: 2000; min-width: 220px; padding: 8px; margin-top: 10px; }
        .site-dropdown a { display: block; padding: 12px 16px; text-decoration: none; color: #444; font-weight: 600; border-radius: 8px; font-size: 0.95rem; }
        .site-dropdown a:hover { background: #f5f5f7; }
        .site-dropdown a.active { color: #111; background: #f0f0f0; }
    </style>
</head>
<body>
    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <div class="site-nav">
                <button class="site-nav-btn" onclick="toggleSiteDropdown()">📈 Stock Overview Pro</button>
                <div id="site-dropdown" class="site-dropdown">
                    <a href="/stock" class="active">📈 Stock Overview Pro</a>
                    <a href="/mdd">📊 MDD Calculator Pro</a>
                    <a href="/record">📝 Stock Record</a>
                </div>
            </div>
            <div style="display: flex; gap: 10px; align-items: center;">
                <select id="list-selector" onchange="changeList()" style="padding: 10px 15px; border-radius: 8px; border: 1px solid #ddd; font-weight: 600; cursor: pointer; background: white;">
                    <option value="bookmark">내 즐겨찾기</option>
                    <option value="nasdaq100">나스닥 100</option>
                </select>
                <div style="display: flex; gap: 5px; align-items: center;">
                    <select id="sort-selector" onchange="resetAndSort()" style="padding: 10px 15px; border-radius: 8px; border: 1px solid #ddd; font-weight: 600; cursor: pointer; background: white;">
                        <option value="default">기본 순서</option>
                        <option value="change">등락률</option>
                        <option value="total_change">60일 등락률</option>
                        <option value="rsi">RSI</option>
                        <option value="mfi">MFI</option>
                        <option value="adx">ADX</option>
                        <option value="pb">%B</option>
                        <option value="dmi">DMI</option>
                        <option value="tech_score">기술적 수치 합산</option>
                        <option value="tech_signal">기술적 신호 개수</option>
                    </select>
                    <button id="sort-direction-btn" onclick="toggleSortDirection()" style="padding: 10px 12px; background: white; border: 1px solid #ddd; border-radius: 8px; font-weight: 800; cursor: pointer; min-width: 45px;">
                        ↓
                    </button>
                </div>
                <div class="filter-wrap" style="position: relative;">
                    <style>
                        .filt-row { display:flex; align-items:center; gap:6px; padding:5px 0; font-size:0.85rem; font-weight:600; cursor:pointer; }
                        .filt-hint { color:#aaa; font-weight:400; font-size:0.72rem; }
                        .filt-num { width:58px; padding:4px 6px; border:1px solid #ddd; border-radius:6px; font-size:0.8rem; }
                    </style>
                    <button id="filter-btn" onclick="toggleFilterPanel()" style="padding:10px 15px; background:white; border:1px solid #ddd; border-radius:8px; font-weight:600; cursor:pointer;">필터</button>
                    <div id="filter-panel" style="display:none; position:absolute; top:100%; right:0; margin-top:8px; background:white; border:1px solid #e5e5e5; border-radius:12px; box-shadow:0 10px 30px rgba(0,0,0,0.12); padding:14px; z-index:2000; min-width:250px; text-align:left;">
                        <div style="font-weight:700; margin-bottom:8px; font-size:0.9rem;">기술적 필터 <span style="font-weight:400;color:#aaa;font-size:0.72rem;">(모두 만족)</span></div>
                        <label class="filt-row"><input type="checkbox" id="f-ma-gc" onchange="onFilterChange()"> MA 골든크로스 <span class="filt-hint">최근5일</span></label>
                        <label class="filt-row"><input type="checkbox" id="f-di-gc" onchange="onFilterChange()"> DI 골든크로스 <span class="filt-hint">최근5일</span></label>
                        <label class="filt-row"><input type="checkbox" id="f-macd-gc" onchange="onFilterChange()"> MACD 골든크로스 <span class="filt-hint">최근5일</span></label>
                        <label class="filt-row"><input type="checkbox" id="f-rsi" onchange="onFilterChange()"> RSI &lt; <input type="number" id="f-rsi-val" value="40" oninput="onFilterChange()" class="filt-num"></label>
                        <label class="filt-row"><input type="checkbox" id="f-mfi" onchange="onFilterChange()"> MFI &lt; <input type="number" id="f-mfi-val" value="40" oninput="onFilterChange()" class="filt-num"></label>
                        <label class="filt-row"><input type="checkbox" id="f-pb" onchange="onFilterChange()"> %B &lt; <input type="number" id="f-pb-val" value="0.3" step="0.1" oninput="onFilterChange()" class="filt-num"></label>
                        <label class="filt-row"><input type="checkbox" id="f-adx" onchange="onFilterChange()"> ADX &gt; <input type="number" id="f-adx-val" value="25" oninput="onFilterChange()" class="filt-num"></label>
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px; border-top:1px solid #f0f0f0; padding-top:8px;">
                            <span style="font-size:0.82rem; color:#666;">매칭: <b id="filter-count">-</b>종목</span>
                            <button onclick="clearFilters()" style="padding:6px 12px; background:#f0f0f0; border:none; border-radius:6px; font-weight:600; cursor:pointer; font-size:0.78rem;">초기화</button>
                        </div>
                    </div>
                </div>
                <div class="chartset-wrap" style="position: relative;">
                    <button id="chartset-btn" onclick="toggleChartSet()" style="padding:10px 15px; background:white; border:1px solid #ddd; border-radius:8px; font-weight:600; cursor:pointer;">차트 설정</button>
                    <div id="chartset-panel" style="display:none; position:absolute; top:100%; right:0; margin-top:8px; background:white; border:1px solid #e5e5e5; border-radius:12px; box-shadow:0 10px 30px rgba(0,0,0,0.12); padding:14px; z-index:2000; min-width:200px; text-align:left;">
                        <div style="font-weight:700; margin-bottom:8px; font-size:0.9rem;">차트 표시</div>
                        <label class="filt-row"><input type="checkbox" id="cs-bb" onchange="onChartSetChange()"> 볼린저밴드 <span class="filt-hint">빨강·파랑·음영</span></label>
                        <label class="filt-row"><input type="checkbox" id="cs-ma5" onchange="onChartSetChange()"> 5일선</label>
                        <label class="filt-row"><input type="checkbox" id="cs-ma20" onchange="onChartSetChange()"> 20일선</label>
                        <label class="filt-row"><input type="checkbox" id="cs-ma60" onchange="onChartSetChange()"> 60일선</label>
                        <label class="filt-row"><input type="checkbox" id="cs-ma120" onchange="onChartSetChange()"> 120일선</label>
                    </div>
                </div>
                <button id="edit-btn" onclick="location.href='/settings'" style="padding: 10px 20px; background: #111; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer;">종목 수정</button>
            </div>
        </div>
        <div id="stock-grid" class="stock-grid">
            <div class="loading">데이터 로딩 중...</div>
        </div>
    </div>
    <div id="error-popup">
        <div class="error-icon">!</div>
        <div id="error-message">문제가 발생했습니다.</div>
    </div>
    <div id="toast"></div>
    <script src="/static/charts_main.js?v=1.7"></script>
    <script src="/static/charts_macd.js?v=1.7"></script>
    <script src="/static/charts_vol.js?v=1.7"></script>
    <script src="/static/charts_popup.js?v=1.7"></script>
    <script src="/static/script.js?v=1.7"></script>
    <script>
        let currentSortDirection = 'desc';
        function toggleSiteDropdown() {
            const d = document.getElementById('site-dropdown');
            d.style.display = d.style.display === 'block' ? 'none' : 'block';
        }
        window.onclick = function(event) {
            if (!event.target.closest('.site-nav')) {
                document.getElementById('site-dropdown').style.display = 'none';
            }
            if (!event.target.closest('.filter-wrap')) {
                const fp = document.getElementById('filter-panel');
                if (fp) fp.style.display = 'none';
            }
            if (!event.target.closest('.chartset-wrap')) {
                const cp = document.getElementById('chartset-panel');
                if (cp) cp.style.display = 'none';
            }
        }
        function toggleChartSet() {
            const p = document.getElementById('chartset-panel');
            p.style.display = p.style.display === 'block' ? 'none' : 'block';
        }
        function initChartSet() {
            const o = getChartOpts();
            ['bb', 'ma5', 'ma20', 'ma60', 'ma120'].forEach(k => {
                const el = document.getElementById('cs-' + k);
                if (el) el.checked = !!o[k];
            });
        }
        function onChartSetChange() {
            ['bb', 'ma5', 'ma20', 'ma60', 'ma120'].forEach(k => {
                const el = document.getElementById('cs-' + k);
                if (el) setChartOpt(k, el.checked);
            });
            if (typeof renderStockCards === 'function') renderStockCards(currentStocksData);
        }
        document.addEventListener('DOMContentLoaded', initChartSet);
        function toggleFilterPanel() {
            const p = document.getElementById('filter-panel');
            p.style.display = p.style.display === 'block' ? 'none' : 'block';
        }
        function onFilterChange() {
            renderStockCards(currentStocksData);
            updateFilterBadge();
        }
        function clearFilters() {
            document.querySelectorAll('#filter-panel input[type=checkbox]').forEach(c => c.checked = false);
            renderStockCards(currentStocksData);
            updateFilterBadge();
        }
        function updateFilterBadge() {
            const n = document.querySelectorAll('#filter-panel input[type=checkbox]:checked').length;
            document.getElementById('filter-btn').innerText = n ? `필터 (${n})` : '필터';
        }
        function changeList() {
            const listType = document.getElementById('list-selector').value;
            const editBtn = document.getElementById('edit-btn');
            editBtn.style.display = (listType === 'bookmark') ? 'block' : 'none';
            fetchStockData(listType);
        }
        function resetAndSort() {
            currentSortDirection = 'desc';
            document.getElementById('sort-direction-btn').innerText = '↓';
            applySort();
        }
        function toggleSortDirection() {
            const btn = document.getElementById('sort-direction-btn');
            currentSortDirection = (currentSortDirection === 'desc') ? 'asc' : 'desc';
            btn.innerText = (currentSortDirection === 'desc') ? '↓' : '↑';
            applySort();
        }
        function applySort() {
            renderStockCards(currentStocksData);
        }
    </script>
</body>
</html>
