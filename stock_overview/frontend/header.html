<div class="stock-header">
    <div class="ticker-group">
        <div class="ticker" onclick="refreshAndCopy('{{ticker}}')" title="클릭: 최신 데이터로 새로고침 + 복사">{{ticker}}</div>
        <div class="company-name">{{name}}</div>
    </div>
    <div class="price-info">
        <div class="current-price">{{currency}}{{price}}</div>
        <div class="change-pct-group">
            <span class="change-pct {{changeClass}}">{{changeSign}}{{changePct}}%</span>
            <span class="change-pct {{totalChangeClass}}">({{totalChangeSign}}{{totalChangePct}}%)</span>
        </div>
    </div>
</div>
