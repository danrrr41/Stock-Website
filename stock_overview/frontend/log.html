<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log</title>
    <link rel="stylesheet" href="/static/style.css">
    <script>
        // 인증 가드
        if (sessionStorage.getItem('site_auth') !== 'true' || !sessionStorage.getItem('user_id')) {
            location.href = '/';
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        .site-nav { position: relative; display: inline-block; }
        .site-nav-btn { background: none; border: none; font-size: 2rem; font-weight: 700; cursor: pointer; padding: 0; display: flex; align-items: center; gap: 5px; color: #111; font-family: 'Inter', 'Malgun Gothic', sans-serif; }
        .site-dropdown { display: none; position: absolute; top: 100%; left: 0; background: white; border: 1px solid #e5e5e5; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); z-index: 2000; min-width: 220px; padding: 8px; margin-top: 10px; }
        .site-dropdown a { display: block; padding: 12px 16px; text-decoration: none; color: #444; font-weight: 600; border-radius: 8px; font-size: 0.95rem; }
        .site-dropdown a:hover { background: #f5f5f7; }
        .site-dropdown a.active { color: #111; background: #f0f0f0; }
        .toolbar-btn { padding: 10px 20px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .btn-dark { background: #111; color: #fff; }
        .btn-light { background: #fff; color: #444; border: 1px solid #ddd; }

        .log-info { font-size: 0.82rem; color: #888; margin: 4px 0 18px 2px; line-height: 1.5; }
        .log-wrap { background: #0f1117; border-radius: 14px; padding: 14px 16px; max-height: 70vh; overflow-y: auto; font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; font-size: 0.82rem; }
        .log-row { display: flex; gap: 12px; padding: 3px 0; border-bottom: 1px solid rgba(255,255,255,0.04); white-space: pre-wrap; word-break: break-all; }
        .log-ts { color: #6b7280; flex-shrink: 0; }
        .log-msg { color: #d1d5db; }
        .log-cron .log-msg { color: #c4b5fd; }
        .log-refresh .log-msg { color: #93c5fd; }
        .log-book .log-msg { color: #9ca3af; }
        .log-error .log-msg { color: #fca5a5; font-weight: 700; }
        .log-empty { color: #6b7280; padding: 30px; text-align: center; }
        .auto-row { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; color: #555; font-weight: 600; }
    </style>
</head>
<body>
    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <div class="site-nav">
                <button class="site-nav-btn" onclick="toggleSiteDropdown()">🧾 Log</button>
                <div id="site-dropdown" class="site-dropdown">
                    <a href="/stock">📈 Overview</a>
                    <a href="/mdd">📊 MDD</a>
                    <a href="/record">📝 Record</a>
                    <a href="/review">🔍 Review</a>
                    <a href="/log" class="active">🧾 Log</a>
                </div>
            </div>
            <div style="display: flex; gap: 12px; align-items: center;">
                <label class="auto-row"><input type="checkbox" id="auto" onchange="toggleAuto()"> 자동 새로고침(10초)</label>
                <button class="toolbar-btn btn-light" onclick="loadLogs()">🔄 새로고침</button>
            </div>
        </div>

        <div class="log-info">
            데이터 다운로드 활동 기록 (최근 1000건, 한국시간). <b>[크론]</b> 매일 자동 업데이트 · <b>[즐겨찾기]</b> Overview 로드 시 재계산 · <b>[새로고침]</b> 티커 클릭 단일 갱신 · <b>[오류]</b> 다운로드 실패.
            <span id="cron-note"></span>
        </div>

        <div id="log-wrap" class="log-wrap"><div class="log-empty">불러오는 중...</div></div>
    </div>

    <div id="error-popup"><div class="error-icon">!</div><div id="error-message"></div></div>

    <script>
        function getUid() { return sessionStorage.getItem('user_id') || ''; }
        function toggleSiteDropdown() {
            const d = document.getElementById('site-dropdown');
            d.style.display = d.style.display === 'block' ? 'none' : 'block';
        }
        window.onclick = function(e) { if (!e.target.closest('.site-nav')) document.getElementById('site-dropdown').style.display = 'none'; };

        function escapeHtml(s) { return String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
        function rowClass(msg) {
            if (msg.includes('[오류]')) return 'log-error';
            if (msg.includes('[크론]')) return 'log-cron';
            if (msg.includes('[새로고침]')) return 'log-refresh';
            if (msg.includes('[즐겨찾기]')) return 'log-book';
            return '';
        }
        async function loadLogs() {
            const wrap = document.getElementById('log-wrap');
            try {
                const res = await fetch(`/api/logs?uid=${getUid()}&limit=500&t=${Date.now()}`);
                if (!res.ok) throw new Error('로그 로드 실패');
                const logs = (await res.json()).logs || [];
                if (!logs.length) { wrap.innerHTML = '<div class="log-empty">아직 기록이 없습니다. Overview를 열거나 종목을 새로고침하면 쌓입니다.</div>'; return; }
                wrap.innerHTML = logs.map(l => `<div class="log-row ${rowClass(l.msg)}"><span class="log-ts">${escapeHtml(l.ts)}</span><span class="log-msg">${escapeHtml(l.msg)}</span></div>`).join('');
            } catch (e) {
                const p = document.getElementById('error-popup'); document.getElementById('error-message').innerText = e.message;
                if (p) { p.style.display = 'flex'; setTimeout(() => p.style.display = 'none', 4000); }
            }
        }
        let autoTimer = null;
        function toggleAuto() {
            if (document.getElementById('auto').checked) { autoTimer = setInterval(loadLogs, 10000); }
            else if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
        }
        loadLogs();
    </script>
</body>
</html>
